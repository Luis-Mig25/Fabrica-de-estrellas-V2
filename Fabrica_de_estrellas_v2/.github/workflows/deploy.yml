name: Desplegar a GitHub Pages

on:
  push:
    branches: ["main"] # 👈 Asegúrate de que tu rama principal se llame "main" o cámbialo a "master"

# Permisos requeridos para interactuar con GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
